---
name: "NEXUS MINIMAL"
author: "ThaiRC (thairc-dev)"
version: "0.1.0"
license: "GPL-3.0-or-later"
renderer: "python -m nexusminimal"
portable_config: "config.yaml"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RESOLUTION: 480x320
  DISPLAY_RGB_LED: 255, 255, 255

metrics:
  - Uso, frequência e temperatura da CPU
  - Uso da RAM em GiB
  - Uso do armazenamento com suporte a contêiner APFS, em GB
  - Rotação das ventoinhas (RPM)
  - Tráfego de rede pela rota padrão
  - Média de carga de um minuto e total de processos
  - Tempo ligado, modelo, sistema operacional, hora e data
