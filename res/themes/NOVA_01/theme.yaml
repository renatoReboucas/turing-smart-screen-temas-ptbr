---
name: "NOVA 01"
author: "ThaiRC (thairc-dev)"
version: "1.0.0"
license: "GPL-3.0-or-later"
renderer: "python -m nova01"
portable_config: "config.yaml"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RESOLUTION: 480x320
  DISPLAY_RGB_LED: 0, 229, 255

metrics:
  - Relógio, data, localização e previsão do tempo para 5 dias
  - Tráfego de rede pela rota padrão (envio e recebimento em MB/s)
  - Percentual da CPU, medidor circular, frequência e gráfico dos últimos 60 s
  - Percentual da RAM, medidor circular, barra segmentada e uso/total em GiB
  - Percentual do SSD, medidor circular, barra segmentada e uso/total em GB
  - Rotação das ventoinhas (RPM) e estado
  - Temperatura da CPU/GPU com gráfico de tendência
  - Tempo ligado com gráfico de tendência
  - Número de processos ativos com gráfico de tendência
